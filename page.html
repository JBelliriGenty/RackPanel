<style>
  :root {
    --bg: #0b0e13; --panel: #141922; --line: #232b38; --text: #e7ecf3; --muted: #8592a6;

  /* Thin themed scrollbars (Chromium uses scrollbar-color above; the pseudo-elements cover older engines). */

  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;

    -webkit-user-select: none; user-select: none; }
  header { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 20px;

  header h1 { font-size: 22px; font-weight: 600; letter-spacing: .02em; }

  #age { color: var(--muted); font-size: 14px; }
  /* Vertical axis: settings above the carousel (pull down to open). */

  #v::-webkit-scrollbar { display: none; }
  #v > * { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
  #home { display: flex; flex-direction: column; }
  main { flex: 1; min-height: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;

  section { flex: 0 0 100%; scroll-snap-align: start; padding: 18px 20px; overflow-y: auto; }
  main > section { display: flex; flex-direction: column; } main > section[hidden] { display: none; }
  h2 .vt { float: right; margin-top: -10px; border: 1px solid var(--line); background: #1b2230; color: var(--text); font: inherit;
    font-size: 14px; text-transform: none; letter-spacing: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; }
  /* Circle view (circle packing, Cairn Map style): group circles holding one circle per element. */

  .pk .pg { fill: #111620; stroke: var(--line); stroke-width: .8; }

  .pk .pgl { fill: var(--muted); font-size: 7px; font-weight: 600; letter-spacing: .04em; }
  .pk .pll { font-size: 4.4px; font-weight: 600; } .pk .pls { font-size: 3.4px; fill: var(--muted); }
  .pk .pl { stroke-width: .9; transition: fill .6s, stroke .6s; }
  .pk .trk { fill: none; stroke: #222a37; stroke-width: 1.1; } .pk .arc { fill: none; stroke-width: 1.1; stroke-linecap: round; }
  .pk .lv-ok { fill: color-mix(in srgb, var(--ok) 16%, var(--panel)); stroke: var(--ok); }

  .pk .alarm { fill: none; stroke: var(--bad); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
  .pk.anim .pi { animation: pop .45s cubic-bezier(.2, .9, .3, 1.2) backwards; animation-delay: calc(var(--i) * 6ms);
    transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } }
  /* Ring gauges (Cairn Map style): one arc per measure, one fixed colour per measure, values as pills. */
  .lg { float: right; display: inline-flex; gap: 14px; margin: -6px 14px 0 0; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--text); }

  .gauge { flex: none; overflow: visible; }

  .gauge .arc { fill: none; stroke-width: 2.6; stroke-linecap: round; }
  .arc { transition: stroke .6s; }
  .gauge .core { stroke: var(--panel); stroke-width: 1; }
  .lvf-ok { fill: var(--ok); } .lvf-warn { fill: var(--warn); } .lvf-bad { fill: var(--bad); } .lvf-info { fill: var(--accent); }
  .gauge .alarm { fill: none; stroke: var(--bad); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
  .rings { display: grid; gap: 8px; }
  .rg { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; min-width: 0; }
  .rg-t { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }

  .rg.tight { padding: 6px 10px; } .rg.tight .rg-t { gap: 1px; } .rg.tight .rg-t b { font-size: 14px; } .rg.tight .rg-t span { line-height: 14px; }
  .rg.down { background: #2a1517; border-color: var(--bad); }

  .zoomhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

  .zoomin { animation: zoomin .35s cubic-bezier(.2, .9, .3, 1.1); }

  .pk .pgl.zm { fill: var(--text); }

  .ct span { color: var(--muted); min-width: 52px; text-align: right; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 14px; }
  nav { height: 56px; display: flex; justify-content: center; align-items: center; gap: 8px; }
  nav button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px;
    padding: 10px 14px; border-radius: 999px; min-height: 44px; }

  .grid { display: grid; gap: 12px; }

  .big { font-size: 46px; font-weight: 700; line-height: 1.05; }

  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 6px 0 10px; }
  .bar i { display: block; height: 100%; background: var(--ok); border-radius: 5px; }
  .bar i.warn { background: var(--warn); } .bar i.bad { background: var(--bad); }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }

    border-left: 4px solid var(--bad); margin-bottom: 8px; font-size: 18px; }
  .calm { font-size: 22px; color: var(--ok); padding: 22px 0; }

  .host b { display: block; font-size: 15px; margin-bottom: 4px; }

  .dot.s0 { background: var(--bad); } .dot.s2 { background: var(--warn); } .dot.s3 { background: var(--accent); }
  .svc { display: flex; align-items: center; padding: 9px 12px; font-size: 14px; }
  .svc em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 13px; }
  #pull { border: 0; background: transparent; color: var(--muted); font-size: 24px; min-width: 44px; min-height: 44px; }
  #settings { padding: 14px 20px; display: flex; flex-direction: column; gap: 12px; }
  .set-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex: 1; min-height: 0; }
  .set-col { display: flex; flex-direction: column; gap: 12px; }
  .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .stp { display: flex; align-items: center; justify-content: space-between; min-height: 46px; font-size: 15px; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .ctl button, .chip, .act, .tog { min-width: 44px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line);

  /* The language works everywhere (kept in this browser when no kiosk agent answers). */

  /* Lot 2: tiles open a full-screen detail sheet. */

  @keyframes sh-in { from { opacity: 0; transform: translateY(24px); } }

  .ranges { margin-left: auto; display: flex; gap: 6px; }

    background: #1b2230; color: var(--text); font: inherit; font-size: 15px; }

  #sh-close { font-size: 22px; margin-left: 8px; }

  .facts { grid-column: 1 / -1; display: flex; gap: 12px; }
  .facts .card { flex: 1; padding: 10px 14px; }
  .facts b { display: block; font-size: 26px; font-weight: 700; }
  .ch { padding: 10px 14px 8px; min-width: 0; }

  .ch .cur b { font-size: 28px; font-weight: 700; }
  .ch .cur small { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .plot { position: relative; height: 88px; margin-top: 4px;
    background: linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 33.33%; border-bottom: 1px solid var(--line); }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .plot path.area { stroke: none; }
  /* Curves sweep in left to right (dash tricks break with non-scaling-stroke in Chromium). */

  @keyframes draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  @keyframes fade { from { opacity: 0; } }
  .ch .cur.multi { gap: 10px; } .ch .cur.multi b { font-size: 18px; }
  .ax { position: absolute; left: 4px; font-size: 11px; color: var(--muted); background: var(--panel); padding: 0 3px; }

  .xs { font-size: 11px; margin-top: 3px; }

  /* Lot 3: live map below the carousel (swipe up). Zones = six live blocks, Topologie = links with flows. */

  .zone { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 0; overflow: hidden;

  .items { display: grid; gap: 6px 4px; align-content: start; }

  @property --p { syntax: "<number>"; inherits: false; initial-value: 0; }
  .ring { --p: 0; --c: var(--ok); position: relative; width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: conic-gradient(var(--c) calc(var(--p) * 1turn), #263041 0); transition: --p .9s ease-out; }
  .ring > i { position: absolute; inset: 4px; border-radius: 50%; background: var(--panel); display: grid; place-items: center;
    font-style: normal; font-size: 10px; font-weight: 600; }
  .items.hosts { grid-template-columns: repeat(6, 1fr); gap: 3px 2px; } .items.hosts .ring { width: 30px; height: 30px; }
  .items.hosts .ring > i { inset: 3px; }

  .items.svcs .sdot { width: 9px; height: 9px; }

  .ring.warn { --c: var(--warn); } .ring.bad { --c: var(--bad); }
  .ring.off { background: #2a1517; box-shadow: inset 0 0 0 2px var(--bad); }

  .sdot { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); position: relative; flex: none; }
  .sdot.s0 { background: var(--bad); } .sdot.s2 { background: var(--warn); } .sdot.s3 { background: var(--accent); }
  .sdot.s0::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--bad); animation: ping 1.6s ease-out infinite; }
  .zbig { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }

  .fill { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .fill i { display: block; height: 100%; background: var(--ok); border-radius: 4px; transition: width .9s ease-out; }
  .fill i.warn { background: var(--warn); } .fill i.bad { background: var(--bad); }

  .tcard h3 { margin: 0 0 2px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }

  #map-topo .base { fill: none; stroke: #2a3446; }
  #map-topo .flow { fill: none; stroke: var(--accent); stroke-dasharray: 3 13; stroke-linecap: round; animation: flow 2s linear infinite; }

const FR_RE = Object.entries(FR).filter(([k]) => k.includes("{")).map(([k, val]) =>

    (_, x) => `(?<${x}>${/^(v|n|h|s|id)$/.test(x) ? "[^ ]+" : ".+?"})`) + "$"), val]);  // numbers have no spaces, names may

  let out = s;

async function api(path, body) {

// What a switch port carries, from the topology (known once the map has been opened).
function portWhat(port) {
  const t = topo;
  if (!t) return "";
  const m = t.machines.find((x) => x.admin && x.admin.join(" ") === port);
  if (m) return tr("admin of {name} (VLAN {v})", {name: m.name, v: conf.admin_vlan});
  const d = t.machines.find((x) => x.port && `${x.parent} ${x.port}` === port);
  if (d) return d.name;
  if (t.wan && `${t.wan.via} ${t.wan.port}` === port) return t.wan.name[0].toUpperCase() + t.wan.name.slice(1);
  const g = t.gear.find((x) => x.port && `${x.parent} ${x.port}` === port);
  if (g) return tr("to {name}", {name: g.name});
  const l = (t.spare || []).find((x) => x.port === port);
  return l ? tr("admin {a} ↔ {b} (VLAN {v})", {a: l.a, b: l.b, v: conf.admin_vlan}) : "";
}
const KINDS = {host: "Host", service: "Uptime Kuma service", switch: "MikroTik switch", port: "Network port",
  pool: "ZFS pool", pbs: "PBS datastore", container: "Docker container", fleet: "Overview"};
const COLORS = ["#5aa9ff", "#f2b134", "#34c77b", "#c58cff"];
const STATUS = {0: ["down", "#f0524f"], 1: ["online", "#34c77b"], 2: ["pending", "#f2b134"], 3: ["maintenance", "#5aa9ff"]};
const fmt = (v, u) => v == null ? "–" : u === "pct" ? (v < 0.1 && v > 0 ? (v * 100).toFixed(1) : Math.round(v * 100)) + PC()
  : u === "bytes" ? bytes(v) : u === "Bps" ? bytes(v) + "/s" : u === "bps" ? (v < 1e6 ? Math.round(v / 1e3) + " kbit/s" : mbits(v / 1e6))
  : u === "ms" ? Math.round(v) + " ms" : u === "c" ? Math.round(v) + " °C" : u === "rpm" ? Math.round(v) + (LANG === "fr" ? " tr/min" : " rpm") : u === "num" ? v.toFixed(2)
  : u === "s" ? since(v) : u === "days" ? Math.round(v) + (LANG === "fr" ? " j" : " d") : u === "status" ? tr((STATUS[v] || ["?"])[0]) : String(Math.round(v));

function closeSheet() {

async function loadSheet(animate) {
  clearTimeout(sheetTimer);
  const token = ++sheetToken, sh = sheet;
  [...$("sh-ranges").children].forEach((b) => b.classList.toggle("on", b.dataset.r === sh.range));
  try {
    const r = await fetch(`/api/detail?kind=${encodeURIComponent(sh.kind)}&name=${encodeURIComponent(sh.name)}&range=${sh.range}`, {cache: "no-store"});

  if (token === sheetToken) sheetTimer = setTimeout(() => loadSheet(false), sh.range === "1h" ? 15000 : 60000);

function plot(c, d) {
  const W = 1000, H = 100, x0 = d.start, x1 = d.end, gap = d.step * 2.5;
  const vals = c.series.flatMap((s) => s.points.map((p) => p[1]));
  const X = (t) => ((t - x0) / (x1 - x0)) * W;
  if (c.unit === "status") {
    const w = (d.step / (x1 - x0)) * W + 0.5;
    return {svg: c.series[0].points.map(([t, v]) =>
      `<rect x="${X(t).toFixed(1)}" y="20" width="${w.toFixed(1)}" height="60" fill="${(STATUS[v] || ["", "#8592a6"])[1]}"/>`).join(""), dots: ""};
  }
  let lo = c.unit === "c" ? Math.floor(Math.min(...vals) - 3) : 0, hi = Math.max(...vals);
  hi = hi <= lo ? lo + 1 : lo + (hi - lo) * 1.12;
  if (c.unit === "pct") hi = Math.min(1, Math.max(hi, 0.05));
  const Y = (v) => H - ((v - lo) / (hi - lo)) * H;
  let svg = "", dots = "";
  c.series.forEach((s, i) => {
    let path = "", prev = null;
    for (const [t, v] of s.points) {
      path += `${prev == null || t - prev > gap ? "M" : "L"}${X(t).toFixed(1)} ${Y(v).toFixed(1)}`;
      prev = t;
    }
    const col = COLORS[i % COLORS.length], first = s.points[0], last = s.points[s.points.length - 1];
    if (i === 0 && !path.slice(1).includes("M"))
      svg += `<path class="area" d="${path}L${X(last[0]).toFixed(1)} ${H}L${X(first[0]).toFixed(1)} ${H}Z" fill="${col}" fill-opacity=".12"/>`;
    svg += `<path d="${path}" stroke="${col}"/>`;
    if (x1 - last[0] <= gap) dots += `<span class="live" style="left:${X(last[0]) / 10}%;top:${Y(last[1])}%;background:${col}"></span>`;
  });
  return {svg, dots, hi, lo};
}

const tw = (key, v, u) => `<b data-k="${esc(key)}" data-v="${v}" data-u="${u}">${fmt(prevVals[key] ?? 0, u)}</b>`;
function renderSheet(d, animate) {
  $("sh-desc").textContent = d.description || "";
  const many = d.charts.length > 4, hhmm = (ts) => new Date(ts * 1000).toLocaleString(LOCALE(),
    d.range === "7d" || d.range === "24h" ? {weekday: "short", hour: "2-digit", minute: "2-digit"} : {hour: "2-digit", minute: "2-digit"});
  $("sh-body").style.gridTemplateColumns = `repeat(${many ? 3 : 2}, 1fr)`;
  let html = d.facts.length ? `<div class="facts">${d.facts.map((f, i) =>
    `<div class="card"><div class="label">${esc(tr(f.label))}</div>${tw("f" + i, f.value, f.unit)}</div>`).join("")}</div>` : "";
  html += d.charts.map((c) => {
    const p = plot(c, d), lastV = (s) => s.points[s.points.length - 1][1];
    const cur = c.unit === "status" ? `<b style="color:${(STATUS[lastV(c.series[0])] || ["", ""])[1]}">${fmt(lastV(c.series[0]), "status")}</b>`
      : c.series.map((s, i) => `<span>${c.series.length > 1 ? `<small><i class="sw" style="background:${COLORS[i % 4]}"></i>${esc(tr(s.label))}</small>` : ""}${tw(c.id + i, lastV(s), c.unit)}</span>`).join("");
    return `<div class="card ch"><div class="label">${esc(tr(c.title))}</div><div class="cur ${c.series.length > 1 ? "multi" : ""}">${cur}</div>
      <div class="plot ${animate ? "draw" : ""}"><svg viewBox="0 0 1000 100" preserveAspectRatio="none">${p.svg}</svg>${p.dots}
        ${p.hi == null ? "" : `<span class="ax hi">${fmt(p.hi, c.unit)}</span><span class="ax lo">${fmt(p.lo, c.unit)}</span>`}</div>
      <div class="row label xs"><span>${hhmm(d.start)}</span><span>${tr("now")}</span></div></div>`;
  }).join("");
  if (d.bars && d.bars.items.length) {
    const top = Math.max(...d.bars.items.map((b) => b.value)) || 1;
    html += `<div class="card bars"><div class="label" style="margin-bottom:6px">${esc(tr(d.bars.title))}</div>
      <div style="columns:2;column-gap:24px">${d.bars.items.map((b) => `<div style="break-inside:avoid"><div class="row"><span>${esc(b.label)}</span><span class="label">${fmt(b.value, d.bars.unit)}</span></div>
      <div class="bar"><i class="${d.bars.unit === "pct" ? level(b.value, 0.75, 0.85) : ""}" style="width:${(d.bars.unit === "pct" ? b.value : b.value / top) * 100}%"></i></div></div>`).join("")}</div></div>`;
  }
  if (!d.charts.length && !d.facts.length) html = `<div class="empty">${tr("No data over the range.")}</div>`;
  $("sh-body").innerHTML = html;
  tween();
}
// Count each value up from its previous one (0 at first open), ~0.7 s, one rAF loop for all.
function tween() {
  const els = [...$("sh-body").querySelectorAll("b[data-k]")].map((el) => {
    const k = el.dataset.k, to = +el.dataset.v, from = prevVals[k] ?? 0;
    prevVals[k] = to;
    return {el, from, to, u: el.dataset.u};
  }).filter((x) => x.from !== x.to);
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / 700), e = 1 - (1 - p) ** 3;
    for (const x of els) x.el.textContent = fmt(p === 1 ? x.to : x.from + (x.to - x.from) * e, x.u);
    if (p < 1 && els.length) requestAnimationFrame(step);
  })(t0);
}

function onTap(e) {
  const t = e.target.closest("[data-d]");
  if (!t || swallow) return;
  const [kind, ...rest] = t.dataset.d.split("|");
  openSheet(kind, rest.join("|"));
}

  const fills = s.storage.map((p) => ({k: p.name, d: `${p.name.startsWith("PBS ") ? "pbs" : "pool"}|${p.name}`, x: p.used / p.size}));

        <span><b class="${svcUp === s.services.length ? "ok" : "bad"}" id="z-svc">${svcUp}/${s.services.length}</b> <small>${tr("services")}</small></span></div>
      <div ${WAN() ? tap("port", WAN()) : ""}><div class="zrow"><span class="label">Internet</span><span id="z-wan">↓ ${mbits(s.wan.rx)} · ↑ ${mbits(s.wan.tx)}</span></div>

    nodes: `<h3 data-slide="nodes">${tr("Nodes")} <span>›</span></h3><div class="items" style="grid-template-columns:repeat(3,1fr);gap:12px 6px">${items.filter((i) => i.zone === "nodes").map(itemHtml).join("")}</div>`,
    hosts: `<h3 data-slide="hosts">VM <span id="z-hosts">${vmUp}/${vms.length}</span></h3><div class="items hosts">${items.filter((i) => i.zone === "hosts").map(itemHtml).join("")}</div>`,

      <div class="fill"><i id="zf-${esc(f.k)}" class="${level(f.x, 0.75, 0.85)}" style="width:${f.x * 100}%"></i></div></div>`).join("")}
      <div class="zrow" style="margin-top:4px"><span class="label">${tr("Backups")}</span><span id="z-bk" class="${s.backups.stale.length ? "bad" : "ok"}">${s.backups.stale.length ? tr("{n} late", {n: s.backups.stale.length}) : tr("{n} up to date", {n: s.backups.count})}</span></div>`,
    network: `<h3 data-slide="network">${tr("Network")} <span>›</span></h3><div class="items" style="grid-template-columns:repeat(${Math.max(1, sws.length)},1fr);gap:10px">${sws.map((w) =>
      `<div class="it" data-d="switch|${esc(w.k)}"><div class="ring big ${w.cls === "ok" ? "" : w.cls}" id="zs-${esc(w.k)}" style="--p:${w.cpu}"><i>${w.temp == null ? "–" : Math.round(w.temp) + "°"}</i></div><small>${esc(w.k)}</small></div>`).join("")}</div>
      <div id="z-ports">${s.links.slice(0, 3).map((l) => `<div class="zrow" data-d="port|${esc(l.name)}"><span>${esc(l.name)}</span><span class="label">${mbits(l.bps / 1e6)}</span></div>`).join("")}</div>`,
  };
  if (sig !== zoneSig) {
    // New element set: rebuild once at --p 0, then the next frame sets the real values so the rings sweep in.

function itemHtml(i) {

    : `<div class="${i.cls}" id="zi-${esc(i.key)}" style="--p:${i.p}"><i>${i.inner}</i></div>`;
  return `<div class="it" ${i.d ? `data-d="${esc(i.d)}"` : ""}>${body}<small>${esc(i.label)}</small></div>`;

// Topology: Internet -> router -> switches / AP -> machines -> guests; dashes flow faster with more traffic.
async function loadTopo() {
  if (Date.now() - topoAt < 14000) return;
  topoAt = Date.now();
  try {
    const r = await fetch("/api/topology", {cache: "no-store"});
    const t = await r.json();
    if (!r.ok) throw new Error(t.error || r.status);
    const first = !topo;
    topo = t; $("map-note").textContent = "";
    paintTopo();
    if (first && lastState) render(lastState);  // the VM circles group by node once the topology is known
  } catch (e) { $("map-note").textContent = tr("Topology unavailable: {e}", {e: tr(e.message)}); }
}
// Duration from the rate; the negative delay keeps each dash train's phase when the SVG is redrawn.
const flowDur = (bps) => +Math.max(0.35, 4 - (Math.log10(Math.max(bps, 1e3)) - 3) * 0.65).toFixed(2);
const flowW = (bps) => (1.5 + Math.max(0, Math.log10(Math.max(bps, 1)) - 3) * 0.8).toFixed(1);
function paintTopo() {
  if (!topo || !lastState) return;
  const t = topo, hosts = byHost(lastState.hosts);
  const sw = new Set(lastState.switches.map((w) => w.name)), W = 1040, H = 600;
  const order = [t.router, ...t.gear.map((g) => g.name)];
  const ms = [...t.machines].sort((a, b) => (order.indexOf(a.parent) - order.indexOf(b.parent)) || a.name.localeCompare(b.name));
  const PER = 8, rows = ms.map((m) => Math.max(1, Math.ceil(m.guests.length / PER)));
  const hs = rows.map((r) => 22 + r * 36), total = hs.reduce((a, b) => a + b, 0) + (ms.length - 1) * 10;
  let y = Math.max(10, (H - total) / 2);
  const pos = {};
  ms.forEach((m, i) => { pos[m.name] = {x: 470, y: y + hs[i] / 2}; y += hs[i] + 10; });
  const kids = (n) => ms.filter((m) => m.parent === n).map((m) => pos[m.name].y);
  // Gear sits level with its machines; gear without machines goes to the top left, out of the links' way.
  // Internet enters through the switch that carries the ISP box: it sits between Internet and the router.
  const wv = t.wan && t.gear.some((g) => g.name === t.wan.via) ? t.wan.via : null, RX = wv ? 185 : 150, GX = wv ? 310 : 290;
  let spare = 30;
  t.gear.forEach((g) => {
    if (g.name === wv) { pos[g.name] = {x: 100, y: H / 2}; return; }
    const k = kids(g.name);
    pos[g.name] = {x: GX, y: k.length ? k.reduce((a, b) => a + b) / k.length : spare};
    if (!k.length) spare += 70;
  });
  // Keep gear apart vertically (two switches with machines centred on the same row).
  t.gear.filter((g) => g.name !== wv).sort((a, b) => pos[a.name].y - pos[b.name].y).reduce((prev, g) => { if (prev != null && pos[g.name].y - prev < 60) pos[g.name].y = prev + 60; return pos[g.name].y; }, null);
  pos[t.router] = {x: RX, y: H / 2}; pos.Internet = {x: wv ? 26 : 30, y: H / 2};
  const lvl = (name) => hostLevel(hosts[uc(name)]), now = performance.now() / 1000;
  const link = (a, b, port, ax, bx) => {
    const p = pos[a], q = pos[b], x1 = p.x + (ax || 0), x2 = q.x - (bx || 0), mx = (x1 + x2) / 2;
    const d = `M${x1} ${p.y}C${mx} ${p.y} ${mx} ${q.y} ${x2} ${q.y}`, bps = port ? t.bps[port] : null;
    return `<g ${port ? `data-d="port|${esc(port)}"` : ""}><path class="base" d="${d}" stroke-width="${bps ? flowW(bps) : 1.5}"/>` +
      (bps ? `<path class="flow" d="${d}" stroke-width="${flowW(bps)}" style="animation-duration:${flowDur(bps)}s;animation-delay:-${(now % flowDur(bps)).toFixed(2)}s"/>` : "") +
      `<path class="hit" d="${d}"/></g>`;
  };
  let svg = wv ? link("Internet", wv, `${wv} ${t.wan.port}`, 18, 18) : link("Internet", t.router, WAN() || null, 18, 22);
  // Spare switch-to-switch links (RSTP keeps them blocked): dotted, like admin ports.
  (t.spare || []).forEach((l) => {
    const a = pos[l.a], b = pos[l.b];
    if (!a || !b) return;
    const d = `M${a.x} ${a.y}C${(a.x + b.x) / 2} ${a.y} ${(a.x + b.x) / 2} ${b.y} ${b.x} ${b.y}`;
    svg += `<g data-d="port|${esc(l.port)}"><path class="adm" d="${d}"/><path class="hit" d="${d}"/></g>`;
  });
  t.gear.forEach((g) => {
    const port = g.port ? `${g.parent} ${g.port}` : null;
    svg += g.name === wv ? link(g.name, g.parent, port, 18, 22) : link(g.parent, g.name, port, 22, 18);
  });
  ms.forEach((m) => { svg += link(m.parent, m.name, m.port ? `${m.parent} ${m.port}` : null, m.parent === t.router ? 22 : 18, 64); });
  // Admin VLAN port (nodes' 1G link): dotted, no traffic animation, it is not the data path.
  ms.forEach((m) => {
    const a = m.admin && pos[m.admin[0]], q = pos[m.name];
    if (!a) return;
    const x1 = a.x + 18, x2 = q.x - 64, mx = (x1 + x2) / 2;
    svg += `<g data-d="port|${esc(m.admin.join(" "))}"><path class="adm" d="M${x1} ${a.y}C${mx} ${a.y} ${mx} ${q.y} ${x2} ${q.y + 8}"/>` +
      `<path class="hit" d="M${x1} ${a.y}C${mx} ${a.y} ${mx} ${q.y} ${x2} ${q.y + 8}"/></g>`;
  });
  const dot = (x, y, r, cls, label, d, sub) => `<g ${d ? `data-d="${esc(d)}"` : ""}><circle cx="${x}" cy="${y}" r="${r}" class="${cls}"/>` +
    (cls.includes("st-bad") ? `<circle cx="${x}" cy="${y}" r="${r}" class="alarm"/>` : "") +
    `<text x="${x}" y="${y + r + 12}" text-anchor="middle" class="${sub ? "sm" : ""}">${esc(label)}</text></g>`;
  const ix = pos.Internet.x;
  svg += `<g ${WAN() ? tap("port", WAN()) : ""}><circle cx="${ix}" cy="${H / 2}" r="16" class="box"/><text x="${ix}" y="${H / 2 + 4}" text-anchor="middle" class="sm">WAN</text>
    <text x="${ix}" y="${H / 2 + 30}" text-anchor="middle" class="sm">${wv ? esc(t.wan.name[0].toUpperCase() + t.wan.name.slice(1)) : "Internet"}</text></g>`;
  svg += dot(RX, H / 2, 20, "box", t.router, sw.has(t.router) ? `switch|${t.router}` : "");
  t.gear.forEach((g) => { svg += dot(pos[g.name].x, pos[g.name].y, 16, "box", g.name, sw.has(g.name) ? `switch|${g.name}` : ""); });
  ms.forEach((m, i) => {
    const {x, y: cy} = pos[m.name], h = hosts[uc(m.name)], lv = lvl(m.name);
    svg += `<g ${h ? `data-d="host|${esc(h.name)}"` : ""}><rect x="${x - 64}" y="${cy - 17}" width="128" height="34" rx="9" class="box ${lv === "bad" ? "st-bad" : ""}"/>
      <circle cx="${x - 50}" cy="${cy}" r="5" class="st-${lv}"/>${lv === "bad" ? `<circle cx="${x - 50}" cy="${cy}" r="5" class="alarm"/>` : ""}
      <text x="${x - 40}" y="${cy + 4}">${esc(m.name)}</text><text x="${x + 58}" y="${cy + 4}" text-anchor="end" class="sm">${h && h.up ? Math.round((h.cpu || 0) * 100) + " %" : ""}</text></g>`;
    const top = cy - (rows[i] * 36) / 2 + 12;
    if (m.guests.length) svg += `<path class="base" d="M${x + 64} ${cy}H576V${top}V${top + (rows[i] - 1) * 36}" stroke-width="1"/>`;
    m.guests.forEach((g, j) => {
      const gx = 592 + (j % PER) * 56, gy = top + Math.floor(j / PER) * 36;
      svg += dot(gx, gy, 8, "st-" + lvl(g), g.length > 9 ? g.slice(0, 8) + "…" : g, hosts[uc(g)] ? `host|${hosts[uc(g)].name}` : "", true);
    });
  });
  cards({data: svg});
}

// Cards: data network (the tree above), then one per other VLAN Cairn Net sees (config order), then the direct storage links.
const cardTitle = (id) => id === "data" ? tr("Data") + (conf.data_vlan ? " · VLAN " + conf.data_vlan : "") : id === "storage" ? tr("Storage · direct links")
  : [(conf.vlans.find((v) => v.id === id) || {}).name, "VLAN " + id].filter(Boolean).join(" · ");
function cards(painted) {
  const t = topo, vl = Object.keys(t.vlans || {}), order = conf.vlans.map((v) => v.id);
  const ids = ["data", ...vl.sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99) || a - b),
    ...((t.storage || []).length ? ["storage"] : [])];
  const box = $("topo-cards");
  if (box.dataset.ids !== LANG + ids.join()) {
    box.dataset.ids = LANG + ids.join();
    box.innerHTML = ids.map((id) => `<div class="tcard"><h3>${esc(cardTitle(id))}${id === conf.admin_vlan && (t.spare || []).length ?
      ` · ${esc(tr("MSTP root {name}", {name: mgRoot(t.spare)}))}` : ""}</h3><div id="tc-${id}"></div></div>`).join("");
    $("topo-dots").innerHTML = ids.map(() => "<i></i>").join("");
    dotsOn();
  }
  const view = (svg, h) => `<svg viewBox="0 0 1040 ${h || 560}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
  $("tc-data").innerHTML = view(painted.data, 600);
  ids.filter((id) => id !== "data").forEach((id) => { $("tc-" + id).innerHTML = view(id === "storage" ? paintStorage() : paintVlan(id)); });
}
function dotsOn() {
  const box = $("topo-cards"), i = Math.round(box.scrollLeft / (box.clientWidth || 1));
  [...$("topo-dots").children].forEach((d, j) => d.classList.toggle("on", j === i));
}
$("topo-cards").addEventListener("scroll", dotsOn, {passive: true});

const H2 = 560, now2 = () => performance.now() / 1000;
// Animated link (same look as the data tree): dashes run faster and thicker with the rate.
function wire(x1, y1, x2, y2, bps, d) {
  const mx = (x1 + x2) / 2, p = `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
  return `<g ${d ? `data-d="${esc(d)}"` : ""}><path class="base" d="${p}" stroke-width="${bps ? flowW(bps) : 1.5}"/>` +
    (bps ? `<path class="flow" d="${p}" stroke-width="${flowW(bps)}" style="animation-duration:${flowDur(bps)}s;animation-delay:-${(now2() % flowDur(bps)).toFixed(2)}s"/>` : "") +
    `<path class="hit" d="${p}"/></g>`;
}
function nodeBox(x, y, name, sub, d) {
  const h = (lastState.hosts || []).find((z) => uc(z.name) === uc(name)), lv = h ? hostLevel(h) : "na";
  return `<g ${h ? `data-d="host|${esc(h.name)}"` : d ? `data-d="${esc(d)}"` : ""}><rect x="${x - 75}" y="${y - 17}" width="150" height="34" rx="9" class="box"/>
    <circle cx="${x - 61}" cy="${y}" r="5" class="st-${lv}"/><text x="${x - 51}" y="${y - 1}">${esc(name.length > 15 ? name.slice(0, 14) + "…" : name)}</text>
    <text x="${x - 51}" y="${y + 11}" class="sm">${esc(sub || "")}</text></g>`;
}
const hub = (x, y, name, d) => `<g ${d ? `data-d="${esc(d)}"` : ""}><circle cx="${x}" cy="${y}" r="16" class="box"/><text x="${x}" y="${y + 30}" text-anchor="middle">${esc(name)}</text></g>`;

// One VLAN: router -> switches carrying it -> devices on their ports.
// The admin VLAN rides the switches' management links, which meet on the MSTP root: the switch
// with the most management links is drawn as the root of that card, not the router.
const mgRoot = (mg) => {
  const c = {};
  mg.forEach((l) => [l.a, l.b].forEach((n) => { c[n] = (c[n] || 0) + 1; }));
  return Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b))[0];
};
function paintVlan(v) {
  const t = topo, devs = t.vlans[v], mg = v === conf.admin_vlan ? (t.spare || []) : [];
  const sws = [...new Set([...devs.map((d) => d.sw), ...mg.flatMap((l) => [l.a, l.b])])];
  const sw = new Set(lastState.switches.map((w) => w.name)), step = Math.min(64, (H2 - 40) / Math.max(1, devs.length));
  const y0 = (H2 - step * (devs.length - 1)) / 2, ys = {};
  devs.forEach((d, i) => { (ys[d.sw] = ys[d.sw] || []).push(y0 + i * step); });
  // Switches without devices here (a switch only in the admin VLAN) go to the top of the switch column.
  let top = 50;
  const R = mg.length ? mgRoot(mg) : t.router, ry = H2 / 2, swy = {};
  sws.forEach((n) => { swy[n] = n === R ? ry : ys[n] ? ys[n].reduce((a, b) => a + b) / ys[n].length : (top += 70) - 70; });
  const sy = (n) => swy[n], sx = (n) => n === R ? 120 : 420;
  let svg = "";
  if (mg.length) {  // admin VLAN: the switches hang together by their management links
    mg.forEach((l) => { const [a, b] = sx(l.a) <= sx(l.b) ? [l.a, l.b] : [l.b, l.a];
      svg += wire(sx(a) + 18, sy(a), sx(b) - (sx(a) === sx(b) ? -18 : 18), sy(b), t.bps[l.port], `port|${l.port}`) +
        `<text x="${sx(b)}" y="${sy(b) + 44}" text-anchor="middle" class="sm">${esc(tr("admin link · {port}", {port: l.port}))}</text>`; });
  } else {
    sws.filter((n) => n !== R).forEach((n) => {
      const g = t.gear.find((x) => x.name === n), port = g && g.port ? `${R} ${g.port}` : null;
      svg += wire(140, ry, 404, sy(n), port ? t.bps[port] : null, port ? `port|${port}` : "");
    });
  }
  devs.forEach((d, i) => {
    const x1 = d.sw === R ? 140 : 436, y1 = d.sw === R ? ry : sy(d.sw), port = `${d.sw} ${d.port}`;
    svg += wire(x1, y1, 760, y0 + i * step, d.port === "Wi-Fi" ? null : t.bps[port], d.port === "Wi-Fi" ? "" : `port|${port}`);
  });
  svg += hub(120, ry, R, sw.has(R) ? `switch|${R}` : "");
  sws.filter((n) => n !== R).forEach((n) => { svg += hub(420, sy(n), n, sw.has(n) ? `switch|${n}` : ""); });
  devs.forEach((d, i) => { svg += nodeBox(835, y0 + i * step, d.name, `${d.port === "Wi-Fi" ? "Wi-Fi " + d.sw : d.sw + " " + d.port}${d.kind && d.kind !== "unknown" ? " · " + d.kind : ""}`, d.port === "Wi-Fi" ? "" : `port|${d.sw} ${d.port}`); });
  return svg;
}

// Direct storage links: each host with its peers, the line runs with the host-side NIC rate.
function paintStorage() {
  const links = topo.storage, hostsA = [...new Set(links.map((l) => l.a))], step = Math.min(90, (H2 - 40) / links.length);
  const y0 = (H2 - step * (links.length - 1)) / 2;
  let svg = "";
  links.forEach((l, i) => {
    const ay = H2 / 2 + (hostsA.indexOf(l.a) - (hostsA.length - 1) / 2) * 90, y = y0 + i * step;
    svg += wire(355, ay, 685, y, l.bps, `host|${l.a}`);
    svg += `<text x="520" y="${(ay + y) / 2 - 6}" text-anchor="middle" class="sm">${esc(l.iface)}${l.bps != null ? " · " + mbits(l.bps / 1e6) : ""}</text>`;
    svg += nodeBox(760, y, l.b, "", "");
  });
  hostsA.forEach((a, k) => { svg += nodeBox(280, H2 / 2 + (k - (hostsA.length - 1) / 2) * 90, a, "NAS", ""); });
  return svg;
}

function setMapView(view) {
  mapView = view;
  [...$("map-views").children].forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  $("map-zones").hidden = view !== "zones"; $("map-topo").hidden = view !== "topo";
  if (view === "topo") { topoAt = 0; loadTopo(); }
}
$("map-views").addEventListener("click", (e) => { if (e.target.dataset.view) setMapView(e.target.dataset.view); });
$("to-map").addEventListener("click", () => v.scrollTo({top: $("map").offsetTop, behavior: "smooth"}));
$("map-close").addEventListener("click", () => showHome());
// A zone title jumps to its carousel screen.
$("map-zones").addEventListener("click", (e) => {
  const h = e.target.closest("[data-slide]");
  if (!h) return;
  const i = visible().findIndex((x) => x.dataset.id === h.dataset.slide);
  showHome(); if (i >= 0) setTimeout(() => go(i), 350);
});
setInterval(() => { if (onMap() && mapView === "topo") loadTopo(); }, 5000);

async function poll() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    const s = await r.json();
    if (!r.ok) throw new Error(s.error || r.status);
    render(s); lastState = s; lastOk = Date.now(); $("error").style.display = "none";
  } catch (e) {
    $("error").textContent = tr("Cannot read the state: {e}", {e: tr(e.message)});
    $("error").style.display = "block";
  }
  clock();
}
// Page language: the kiosk's setting, else this browser's choice, else the server's default.
function setLang(pick) {
  let saved = "";
  try { saved = localStorage.getItem("rp-lang") || ""; } catch { /* private window */ }
  const want = pick || (local && cfg.lang) || saved || conf.lang || "en";
  if (want === LANG && !pick) return;
  LANG = want === "fr" ? "fr" : "en";
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = tr(el.dataset.t); });
  legends(); layoutSlides(); renderSettings(); clock();
  if (sheet) { $("sh-kind").textContent = ""; openSheet(sheet.kind, sheet.name); }
  if (lastState) { zoneSig = ""; render(lastState); }
}
$("langs").addEventListener("click", (e) => {
  const l = e.target.dataset.lang;
  if (!l) return;
  try { localStorage.setItem("rp-lang", l); } catch { /* not kept */ }
  if (local) { cfg.lang = l; api("/local/settings", {lang: l}).then((r) => { local.settings = r.settings; }).catch(() => {}); }
  setLang(l);
});

async function loadConf() {
  try {
    const r = await fetch("/api/config", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    conf = await r.json();
  } catch { setTimeout(loadConf, 30000); return; }  // older server or down: keep the defaults, try again
  document.title = $("title").textContent = conf.title;
  layoutSlides(); seedWan(); setLang();
  if (lastState) render(lastState);
}
loadConf(); poll(); setInterval(poll, POLL_MS);
// Pick up a new page version deployed on the server without touching the screen.
setInterval(() => location.reload(), 6 * 3600 * 1000);
</script>
</body>
</html>
